<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISYS2001 Final Review Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;

            margin-bottom: 30px;
            padding-bottom: 20px;

        }

        }

            margin-bottom: 20px;

            border: none;

            font-size: 1em;

        .topic-btn:hover {

        }

        .topic-btn:active {

            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .settings label {
            font-weight: bold;
            color: #333;
        }

        .settings select {
            padding: 8px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }

            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;

            background: #218838;
        }

        .quiz-container {
            display: none;
        }

        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .question-number {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .question-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: white;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #e8eeff;
        }

        .option.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .explanation {
            margin-top: 10px;
            font-style: italic;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            background: #5568d3;
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results {
            display: none;
        }

        .score-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .score-number {
            font-size: 3em;
            font-weight: bold;
            margin: 15px 0;
        }

        .score-feedback {
            font-size: 1.2em;
            margin-top: 10px;
        }

        .review-section {
            margin-top: 30px;

        .review-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #dc3545;

        .review-question {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .review-answers {
            margin-top: 10px;
            line-height: 1.8;
        }

        .review-answers div {
            margin: 5px 0;
        }

        .your-answer {
            color: #dc3545;
        }

        .correct-answer {
            color: #28a745;
        }

        .restart-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 30px auto;
        }

        .restart-btn:hover {
            background: #5568d3;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

            </div>

            <div id="review-section" class="review-section"></div>

            <button class="restart-btn" id="restart-btn">Take Another Quiz</button>
        </div>
    </div>

    <script>

            robust_apps: [
                {
                    question: "What is the purpose of the 'except' block?",

        // Application State
        let currentTopic = null;

        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const topicButtons = document.querySelectorAll('.topic-btn');
        const startBtn = document.getElementById('start-quiz');
        const numQuestionsSelect = document.getElementById('num-questions');
        const questionNumber = document.getElementById('question-number');

        const optionsContainer = document.getElementById('options');
        const feedback = document.getElementById('feedback');

        const nextBtn = document.getElementById('next-btn');

        const scoreFeedback = document.getElementById('score-feedback');

                topicButtons.forEach(b => b.style.opacity = '0.6');
                btn.style.opacity = '1';
                currentTopic = btn.dataset.topic;

                startBtn.textContent = 'Start Quiz';

        });

        startBtn.addEventListener('click', startQuiz);
        prevBtn.addEventListener('click', previousQuestion);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restart);

        function startQuiz() {
            const numQuestions = parseInt(numQuestionsSelect.value);

            // Get questions based on topic
            if (currentTopic === 'mixed') {
                const allQuestions = Object.values(questionBank).flat();
                currentQuestions = getRandomQuestions(allQuestions, numQuestions);
            } else {
                currentQuestions = getRandomQuestions(questionBank[currentTopic], numQuestions);
            }

            // Reset state
            currentQuestionIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null);
            score = 0;

            // Show quiz screen
            welcomeScreen.style.display = 'none';
            quizScreen.style.display = 'block';

            displayQuestion();
        }

        function getRandomQuestions(pool, count) {
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, Math.min(count, pool.length));
        }

        function displayQuestion() {
            const question = currentQuestions[currentQuestionIndex];

            // Update question number
            questionNumber.textContent = `Question ${currentQuestionIndex + 1} of ${currentQuestions.length}`;

            // Update question text
            questionText.textContent = question.question;

            // Clear and populate options
            optionsContainer.innerHTML = '';
            feedback.style.display = 'none';
            feedback.className = 'feedback';

            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option;
                optionDiv.dataset.index = index;

                // Restore previous selection if exists
                if (userAnswers[currentQuestionIndex] !== null) {
                    optionDiv.classList.add('disabled');
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionDiv.classList.add('selected');
                        if (index === question.answer) {
                            optionDiv.classList.add('correct');
                        } else {
                            optionDiv.classList.add('incorrect');
                        }
                    }
                    if (index === question.answer) {
                        optionDiv.classList.add('correct');
                    }
                    showFeedback(userAnswers[currentQuestionIndex] === question.answer, question.explanation);
                } else {
                    optionDiv.addEventListener('click', () => selectAnswer(index));
                }

                optionsContainer.appendChild(optionDiv);
            });

            // Update navigation buttons
            prevBtn.disabled = currentQuestionIndex === 0;
            updateNextButton();
        }

        function selectAnswer(selectedIndex) {
            const question = currentQuestions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedIndex;

            // Disable all options
            const options = optionsContainer.querySelectorAll('.option');
            options.forEach(opt => {
                opt.classList.add('disabled');
                opt.style.cursor = 'not-allowed';

                const index = parseInt(opt.dataset.index);
                if (index === selectedIndex) {
                    opt.classList.add('selected');
                    if (index === question.answer) {
                        opt.classList.add('correct');
                    } else {
                        opt.classList.add('incorrect');
                    }
                }
                if (index === question.answer) {
                    opt.classList.add('correct');
                }
            });

            // Show feedback
            const isCorrect = selectedIndex === question.answer;
            if (isCorrect) score++;
            showFeedback(isCorrect, question.explanation);

            // Enable next button
            updateNextButton();
        }

        function showFeedback(isCorrect, explanation) {
            feedback.style.display = 'block';
            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');

            const icon = isCorrect ? '✓' : '✗';
            const message = isCorrect ? 'Correct!' : 'Incorrect';

            feedback.innerHTML = `
                <div><span class="feedback-icon">${icon}</span><strong>${message}</strong></div>
                <div class="explanation">${explanation}</div>
            `;
        }

        function updateNextButton() {
            if (userAnswers[currentQuestionIndex] !== null) {
                nextBtn.disabled = false;
                if (currentQuestionIndex === currentQuestions.length - 1) {
                    nextBtn.textContent = 'View Results';
                } else {
                    nextBtn.textContent = 'Next Question';
                }
            } else {
                nextBtn.disabled = true;
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.style.display = 'none';
            resultsScreen.style.display = 'block';

            const percentage = (score / currentQuestions.length) * 100;
            finalScore.textContent = `${score} / ${currentQuestions.length} (${percentage.toFixed(1)}%)`;

            // Performance feedback
            let feedbackText = '';
            if (percentage >= 90) {
                feedbackText = 'Excellent work! You have a strong grasp of this material.';
            } else if (percentage >= 70) {
                feedbackText = 'Good job! You understand most concepts. Review the areas you missed.';
            } else if (percentage >= 50) {
                feedbackText = 'Fair effort. Consider reviewing the material and retaking the quiz.';
            } else {
                feedbackText = 'You may need more practice. Review the course materials carefully.';
            }
            scoreFeedback.textContent = feedbackText;

            // Show review of incorrect answers
            const incorrectAnswers = currentQuestions.filter((q, i) => userAnswers[i] !== q.answer);

            if (incorrectAnswers.length > 0) {
                reviewSection.innerHTML = `<h3 style="color: #333; margin-bottom: 20px;">Questions to Review (${incorrectAnswers.length})</h3>`;

                incorrectAnswers.forEach((q, idx) => {
                    const questionIndex = currentQuestions.indexOf(q);
                    const reviewItem = document.createElement('div');
                    reviewItem.className = 'review-item';
                    reviewItem.innerHTML = `
                        <div class="review-question">${idx + 1}. ${q.question}</div>
                        <div class="review-answers">
                            <div class="your-answer"><strong>Your answer:</strong> ${q.options[userAnswers[questionIndex]]}</div>
                            <div class="correct-answer"><strong>Correct answer:</strong> ${q.options[q.answer]}</div>
                            <div style="margin-top: 10px; font-style: italic; color: #555;">${q.explanation}</div>
                        </div>
                    `;
                    reviewSection.appendChild(reviewItem);
                });
            } else {
                reviewSection.innerHTML = '<h3 style="color: #28a745; text-align: center;">Perfect score! No questions to review.</h3>';
            }
        }

        function restart() {
            resultsScreen.style.display = 'none';
            welcomeScreen.style.display = 'block';
            topicButtons.forEach(b => b.style.opacity = '1');
            currentTopic = null;
            startBtn.disabled = true;
            startBtn.textContent = 'Select a topic to start';
        }
    </script>
</body>
</html>
